 let h='';for(let k=0;k<=4;k++){const v=x0+(x1-x0)*k/4;h+=`<div class="ax" style="left:${P+(W-2*P)*k/4-10}px;bottom:4px">${fmt(10**v)}</div>`;const u=y0+(y1-y0)*k/4;h+=`<div class="ax" style="left:3px;top:${H-P-(H-2*P)*k/4-6}px">${fmt(10**u-1)}</div>`}
 if(S.deal_median_views){h+=`<div class="med" style="left:${P+(Math.log10(S.deal_median_views)-x0)/((x1-x0)||1)*(W-2*P)}px"></div>`}
 return h}
function draw(intro){const h=layout();el.innerHTML=h+R.map((r,i)=>`<img loading="lazy" data-i="${i}" src="${r.thumb||''}" alt="" class="${r.own?'own':''}" title="${esc(r.own?'you':'@'+r.creator)} · ${fmt(r.views)} views" onclick="openR(${i})">`).join('');
 const imgs=[...el.querySelectorAll('img')];
 if(intro){const cols=Math.max(4,Math.floor(el.clientWidth/3/26));imgs.forEach((im,i)=>{im.style.transition='none';im.style.left=(16+(i%cols)*26)+'px';im.style.top=(20+Math.floor(i/cols)*34)%(el.clientHeight-20)+'px'});
  el.offsetHeight;const order=R.map((r,i)=>i).sort((a,b)=>R[a].views-R[b].views);order.forEach((i,k)=>setTimeout(()=>{const im=imgs[i];im.style.transition='';im.style.left=pos[i][0]+'px';im.style.top=pos[i][1]+'px'},12*k))}
 else imgs.forEach((im,i)=>{im.style.left=pos[i][0]+'px';im.style.top=pos[i][1]+'px'});hl()}
function hl(){el.querySelectorAll('img').forEach(im=>{const r=R[+im.dataset.i];im.classList.toggle('dim',!!filt&&r.format!==filt);im.classList.toggle('hi',!!filt&&r.format===filt)})}
function chips(){$('#chips').innerHTML=[null,...D.formats.map(f=>f.name)].map(n=>`<span class="chip ${n===filt?'on':''}" onclick="setF(${n===null?'null':`'${encodeURIComponent(n)}'`})">${n===null?'All':esc(n)}</span>`).join('')}
function setF(n){filt=n===null?null:decodeURIComponent(n);chips();hl()}
function lb(){$('#lb').innerHTML=D.formats.map(f=>`<tr class="f ${f.too_few_to_call?'small':''}" onclick="openF('${encodeURIComponent(f.name)}')"><td><b>${esc(f.name)}</b>${f.too_few_to_call?' <span class="mut">(too few to call)</span>':''}<div class="mut">${esc(f.description)}</div></td><td>${f.count}<div class="mut">${f.creators} creators</div></td><td>${fmt(f.median_views)}</td><td>${f.vs_deal!=null?f.vs_deal+'x':'–'}</td><td>${f.median_likes_per_1k??'–'}</td><td>${f.carson.count?f.carson.count+' · '+fmt(f.carson.median_views):'–'}</td></tr>`).join('')}
function show(h){$('#pin').innerHTML='<button class="ghost" onclick="closeP()">✕ Close</button>'+h;$('#panel').style.display='block'}
function parts(bs){return (bs||[]).map(b=>`<div class="part ${b.part}"><b>${b.part}</b> <span class="mut">${b.t!=null?(+b.t).toFixed(1)+'s':''}</span><div>${esc(b.text??b.line)}</div></div>`).join('')}
function openR(i){const r=R[i];const hook=(r.breakdown||[])[0];show(`<h2>${r.own?'Your post':'@'+esc(r.creator)}</h2>
 <div class="stats"><div class="stat"><span class="mut">Views</span><b>${fmt(r.views)}</b></div><div class="stat"><span class="mut">Likes</span><b>${fmt(r.likes)}</b></div><div class="stat"><span class="mut">Length</span><b>${r.duration?Math.round(r.duration)+'s':'–'}</b></div></div>
 <p class="mut">${r.date||''} · ${r.platform} · format: <b>${esc(r.format)}</b>${r.format_conf!=null?' ('+Math.round(r.format_conf*100)+'% sure)':''}${r.shows_brand!=null?' · shows brand '+Math.round(r.shows_brand*100)+'%':''}</p>
 <p><a href="${r.url}" target="_blank" rel="noopener">Open original ↗</a></p>
 ${r.on_screen_text?`<p><b>On-screen text:</b> ${esc(r.on_screen_text)}</p>`:''}${r.why?`<p><b>Why it works:</b> ${esc(r.why)}</p>`:''}
 <h2>Script</h2>${parts(r.breakdown)||'<p class="mut">No speech.</p>'}<h2>Caption</h2><p class="mut">${esc(r.caption)}</p>`)}
function openF(n){n=decodeURIComponent(n);const f=D.formats.find(x=>x.name==n);show(`<h2>${esc(f.name)}</h2><p>${esc(f.description)}</p>
 <p class="mut">${f.count} videos · ${f.creators} creators · median ${fmt(f.median_views)} views${f.vs_deal!=null?' · '+f.vs_deal+'x the deal':''}${f.too_few_to_call?' · too few to call':''}</p>
 <h2>Best examples</h2>${f.best_examples.map(e=>`<div><a href="${e.url}" target="_blank" rel="noopener">@${esc(e.creator)} · ${fmt(e.views)}</a></div>`).join('')}
 <h2>Copy this</h2><div class="mut">The real script of the top example, <a href="${f.copy_this.source_url}" target="_blank">@${esc(f.copy_this.creator)}</a> (${fmt(f.copy_this.views)} views). Not AI-written.</div>
 ${f.copy_this.on_screen_text?`<p><b>On-screen text:</b> ${esc(f.copy_this.on_screen_text)}</p>`:''}${parts(f.copy_this.skeleton)}
 <p><button onclick="setF('${encodeURIComponent(f.name)}');closeP();scrollTo(0,0)">Light up on chart</button></p>`)}
function closeP(){$('#panel').style.display='none'}$('#panel').onclick=e=>{if(e.target.id=='panel')closeP()};
$('#decode').onclick=()=>draw(true);chips();lb();draw(true);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>draw(false),200)});
</script></body></html>
